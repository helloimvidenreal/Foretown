<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foretown | Play on Roblox</title>
<meta name="description" content="Foretown is a Roblox game where you make avatars, build your own games, and play games made by other players.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
/* ===== EDIT ME: colors ===== */
:root{
  --bg:#000; --surface:#171717; --surface-2:#252525;
  --text:#fafafa; --muted:#a3a3a3;
  --brand:#826a9e;      /* purple buttons */
  --glow:#ffddbf;       /* lit-window peach */
  --line:rgba(255,255,255,.12);
  --pill:3.75rem; --block:1.25rem;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 1rem/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;font-weight:800;line-height:1.1}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem)}
section{padding:clamp(3rem,7vw,6rem) 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.6rem;border:2px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--pill);font:500 .95rem Inter;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:transparent}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--brand)}
.btn.sm{padding:.55rem 1.1rem;font-size:.85rem}

/* announcement */
.announce{background:var(--brand);text-align:center;padding:.5rem 1rem;font-size:.875rem;font-weight:500}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:76px;gap:1.5rem}
.logo{font:800 1.6rem Montserrat;letter-spacing:-.02em}
.logo span{color:var(--glow)}
nav.main{display:flex;gap:2rem;font-weight:500}
nav.main a{color:var(--muted);transition:color .2s}
nav.main a:hover{color:var(--text)}

/* hero */
.hero{position:relative;padding:clamp(4rem,10vw,8rem) 0 0;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(130,106,158,.35),transparent 70%)}
.hero .wrap{position:relative;z-index:2;text-align:center}
.hero h1{font-size:clamp(3.5rem,12vw,9rem);letter-spacing:-.04em}
.hero p{max-width:34rem;margin:1.25rem auto 2rem;color:var(--muted);font-size:1.125rem}
.hero .row{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
#town{display:block;width:100%;height:auto;margin-top:clamp(2rem,5vw,4rem)}
#town .house{fill:#0d0d0d;stroke:rgba(255,255,255,.07)}
#town .w{fill:#2a2433;transition:fill .5s,filter .5s}
#town .w.on{fill:var(--glow);filter:drop-shadow(0 0 6px rgba(255,221,191,.8))}

/* section heads */
.head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:2rem}
.head h2{font-size:clamp(1.75rem,3.5vw,2.75rem)}
.head a.link{color:var(--muted);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}

/* browse by area */
.areas{display:flex;gap:clamp(1rem,3vw,2.5rem);overflow-x:auto;padding-bottom:1rem;scrollbar-width:none}
.area{flex:0 0 auto;width:clamp(110px,13vw,150px);text-align:center;font-weight:500}
.area .disc{aspect-ratio:1;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;margin-bottom:.75rem;transition:border-color .2s,background .2s}
.area:hover .disc{border-color:var(--brand);background:var(--surface-2)}
.area svg{width:44%;fill:none;stroke:var(--glow);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* carousel */
.arrows{display:flex;gap:.5rem}
.arrows button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:1.1rem;transition:border-color .2s}
.arrows button:hover{border-color:var(--brand)}
.rail{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:.5rem}
.card{flex:0 0 clamp(220px,24vw,300px);scroll-snap-align:start}
.media{aspect-ratio:1;border-radius:var(--block);background:linear-gradient(145deg,var(--surface-2),var(--surface));display:grid;place-items:center;color:var(--muted);font-size:.85rem;position:relative;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:.75rem;left:.75rem;background:var(--glow);color:#000;font-size:.75rem;font-weight:700;padding:.2rem .65rem;border-radius:var(--pill)}
.card h3{font:700 1rem Inter;margin:.9rem 0 .15rem}
.price{color:var(--muted);margin-bottom:.8rem}
.price b{color:var(--glow);font-weight:500}

/* updates tabs */
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
.tabs button{padding:.55rem 1.2rem;border-radius:var(--pill);border:2px solid var(--line);background:transparent;color:var(--muted);font:500 .9rem Inter;cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--brand);background:var(--brand);color:#fff}
.panel{display:none;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.panel.show{display:grid}
.post .media{aspect-ratio:16/10}
.post h3{font:700 1.1rem Inter;margin:.9rem 0 .25rem}
.post p{color:var(--muted);font-size:.925rem}
.post time{color:var(--glow);font-size:.85rem}

/* community split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:center;background:var(--surface);border-radius:calc(var(--block)*1.6);padding:clamp(1.5rem,4vw,3.5rem)}
.split .media{aspect-ratio:4/3}
.split h2{font-size:clamp(1.75rem,3.5vw,2.75rem);margin-bottom:1rem}
.split p{color:var(--muted);margin-bottom:1.5rem;max-width:30rem}

/* footer */
footer{border-top:1px solid var(--line);padding:3rem 0 2rem;color:var(--muted);font-size:.925rem}
.cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem;margin-bottom:2.5rem}
footer h4{color:var(--text);font:700 .95rem Inter;margin-bottom:.8rem}
footer li{list-style:none;margin-bottom:.45rem}
footer ul{padding:0}
footer a:hover{color:var(--text)}
.fine{border-top:1px solid var(--line);padding-top:1.5rem;font-size:.8rem}

/* mobile dock + cookies */
.dock{display:none}
.cookie{position:fixed;left:1rem;bottom:1rem;z-index:40;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--block);padding:1.1rem;font-size:.875rem}
.cookie .row{display:flex;gap:.5rem;margin-top:.8rem}

@media(max-width:1023px){
  nav.main,.bar .btn{display:none}
  .bar{height:64px}
  .dock{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom,0px));text-align:center;font-size:.75rem;color:var(--muted)}
  .dock a{display:grid;gap:.15rem;justify-items:center;padding:.25rem}
  .dock a.go{color:var(--glow)}
  .dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  body{padding-bottom:70px}
  .cookie{bottom:80px}
  .split{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr 1fr}
  .arrows{display:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
